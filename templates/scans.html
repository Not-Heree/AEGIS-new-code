{% extends "base.html" %}
{% block title %}Scans - EASM Tool{% endblock %}

{% block content %}
<div class="mb-4">
    <h2><i class="bi bi-radar"></i> Scans</h2>
</div>

<div class="row">
    <div class="col-md-6">
        <div class="card mb-4">
            <div class="card-header">
                <h5>Run Scan</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Target</label>
                    <select class="form-select" id="scan-target">
                        <option>Loading...</option>
                    </select>
                </div>
                <!-- Removed dedicated scan types as per user request — only full scan allowed -->
                <input type="hidden" id="scan-type" value="full">
                <button class="btn btn-primary w-100" onclick="runScan()">
                    <i class="bi bi-play-circle-fill"></i> Start Full Scan
                </button>
                <div id="scan-status" class="mt-3"></div>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5>Recent Scans</h5>
            </div>
            <div class="card-body" id="scan-history">Loading...</div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let activeScanId = null;
    let pollInterval = null;

    async function loadTargets() {
        try {
            const data = await api.get('/api/targets/');
            const select = document.getElementById('scan-target');
            const targets = data.targets || [];

            if (targets.length === 0) {
                select.innerHTML = '<option value="">No targets — add one first</option>';
                return;
            }

            select.innerHTML = targets.map(t => {
                const domain = t.root_domain || t.domain || '';
                return `<option value="${domain}">${domain}</option>`;
            }).join('');

            // Load history for the first target automatically
            loadHistory();

        } catch (error) {
            console.error('Error loading targets:', error);
            document.getElementById('scan-target').innerHTML =
                '<option value="">Error loading targets</option>';
        }
    }

    async function runScan() {
        const domain = document.getElementById('scan-target').value;
        const type = document.getElementById('scan-type').value;

        if (!domain) {
            alert('Select a target first');
            return;
        }

        const statusDiv = document.getElementById('scan-status');

        // Non-full scans are disabled in UI — keeping original logic commented for reference or removing if clean

        // ═══ FULL SCAN — non-blocking with progress polling ═══

        statusDiv.innerHTML = `
        <div class="alert alert-info">
            <div class="d-flex align-items-center">
                <div class="spinner-border spinner-border-sm me-2"></div>
                <div class="flex-grow-1">
                    <strong>Full scan started for ${domain}</strong>
                    <div id="scan-phase" class="text-muted small">Initializing...</div>
                    <div class="progress mt-2" style="height: 22px;">
                        <div class="progress-bar progress-bar-striped progress-bar-animated"
                             id="scan-progress" role="progressbar"
                             style="width: 0%">0%</div>
                    </div>
                </div>
            </div>
        </div>`;

        try {
            const result = await api.post(`/api/scans/full/${domain}`);

            if (!result.success) {
                statusDiv.innerHTML = `
                <div class="alert alert-danger">
                    <i class="bi bi-x-circle"></i> ${result.error}
                </div>`;
                return;
            }

            trackScan(result.scan_id, domain);

        } catch (e) {
            statusDiv.innerHTML = `
            <div class="alert alert-danger">
                <i class="bi bi-x-circle"></i> Error starting scan: ${e.message}
            </div>`;
        }
    }

    /**
     * Reusable scan tracking logic for both new and resumed scans
     */
    async function trackScan(scanId, domain) {
        if (pollInterval) clearInterval(pollInterval);
        activeScanId = scanId;

        const statusDiv = document.getElementById('scan-status');

        // Initial UI state (useful for resumed scans)
        statusDiv.innerHTML = `
        <div class="alert alert-info">
            <div class="d-flex align-items-center">
                <div class="spinner-border spinner-border-sm me-2"></div>
                <div class="flex-grow-1">
                    <strong>Full scan in progress for ${domain}</strong>
                    <div id="scan-phase" class="text-muted small">Loading status...</div>
                    <div class="progress mt-2" style="height: 22px;">
                        <div class="progress-bar progress-bar-striped progress-bar-animated"
                             id="scan-progress" role="progressbar"
                             style="width: 0%">0%</div>
                    </div>
                </div>
            </div>
        </div>`;

        // Poll every 3 seconds
        pollInterval = setInterval(async () => {
            try {
                const status = await api.get(`/api/scans/status/${scanId}`);
                const scan = status.scan || {};

                // Update progress bar
                const percent = scan.progress_percent || 0;
                const bar = document.getElementById('scan-progress');
                if (bar) {
                    bar.style.width = percent + '%';
                    bar.textContent = percent + '%';
                }

                // Update phase text
                const phaseEl = document.getElementById('scan-phase');
                if (phaseEl) {
                    phaseEl.textContent = scan.phase_detail || scan.current_phase || 'Processing...';
                }

                // Check completion
                if (scan.status === 'completed') {
                    clearInterval(pollInterval);
                    pollInterval = null;
                    activeScanId = null;
                    const r = scan.results || {};
                    statusDiv.innerHTML = `
                    <div class="alert alert-success">
                        <i class="bi bi-check-circle-fill"></i> <strong>Scan completed!</strong>
                        <br>
                        <small>
                            Subdomains: ${r.subdomains_found || 0} |
                            Ports: ${r.ports_found || 0} |
                            HTTP: ${r.http_assets_found || 0} |
                            Vulns: ${r.vulns_found || 0} |
                            Risk: ${r.risk_score || 0}/100
                        </small>
                    </div>`;
                    loadHistory();
                } else if (scan.status === 'failed') {
                    clearInterval(pollInterval);
                    pollInterval = null;
                    activeScanId = null;
                    statusDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-x-circle-fill"></i> Scan failed: ${scan.error_message || 'Unknown error'}
                    </div>`;
                    loadHistory();
                }
            } catch (pollErr) {
                console.error('Poll error:', pollErr);
            }
        }, 3000);
    }

    async function loadHistory() {
        const domain = document.getElementById('scan-target').value;
        const historyDiv = document.getElementById('scan-history');

        if (!domain) {
            historyDiv.innerHTML = '<p class="text-muted">Select a target to see scan history</p>';
            return;
        }

        try {
            const data = await api.get('/api/scans/history/' + domain);
            const history = data.history || [];

            if (history.length === 0) {
                historyDiv.innerHTML = '<p class="text-muted">No scans yet. Run your first scan!</p>';
                return;
            }

            // Auto-resume tracking if the latest scan is running
            const latest = history[0];
            if (latest.status === 'running' && latest._id !== activeScanId) {
                trackScan(latest._id, domain);
            }

            historyDiv.innerHTML = history.map(s => {
                const statusBadge = {
                    'completed': '<span class="badge bg-success">Completed</span>',
                    'running': '<span class="badge bg-info">Running</span>',
                    'failed': '<span class="badge bg-danger">Failed</span>',
                    'partial': '<span class="badge bg-warning text-dark">Partial</span>'
                }[s.status] || `<span class="badge bg-secondary">${s.status || 'unknown'}</span>`;

                const scanType = {
                    'full': '🔍 Full Scan'
                }[s.scan_type] || s.scan_type || 'Unknown';

                const startedAt = s.started_at
                    ? new Date(s.started_at).toLocaleString()
                    : 'Unknown';

                // Show stats if available
                let statsHtml = '';
                if (s.stats) {
                    const stats = s.stats;
                    const parts = [];
                    if (stats.subdomains_found) parts.push(`Subs: ${stats.subdomains_found}`);
                    if (stats.ports_found) parts.push(`Ports: ${stats.ports_found}`);
                    if (stats.http_assets_found) parts.push(`HTTP: ${stats.http_assets_found}`);
                    if (stats.vulns_found) parts.push(`Vulns: ${stats.vulns_found}`);
                    // Handle full scan nested results
                    if (stats.subdomains && stats.subdomains.count) parts.push(`Subs: ${stats.subdomains.count}`);
                    if (stats.ports && stats.ports.count) parts.push(`Ports: ${stats.ports.count}`);
                    if (stats.http && stats.http.count) parts.push(`HTTP: ${stats.http.count}`);
                    if (stats.vulns && stats.vulns.count) parts.push(`Vulns: ${stats.vulns.count}`);

                    if (parts.length > 0) {
                        statsHtml = `<br><small class="text-muted">${parts.join(' | ')}</small>`;
                    }
                }

                return `
                    <div class="border-bottom py-2">
                        <div class="d-flex justify-content-between align-items-start">
                            <strong>${scanType}</strong>
                            ${statusBadge}
                        </div>
                        <small class="text-muted">${startedAt}</small>
                        ${statsHtml}
                        ${s.error ? `<br><small class="text-danger">Error: ${s.error}</small>` : ''}
                    </div>`;
            }).join('');

        } catch (error) {
            console.error('Error loading history:', error);
            historyDiv.innerHTML = '<p class="text-danger">Error loading scan history</p>';
        }
    }

    // Reload history when target changes
    document.getElementById('scan-target').addEventListener('change', loadHistory);

    // Initialize
    loadTargets();
</script>
{% endblock %}
