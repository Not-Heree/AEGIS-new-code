{% extends "base.html" %}
{% block title %}Changes - EASM Tool{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-clock-history"></i> Changes</h2>
    <button class="btn btn-primary" onclick="loadChanges()">
        <i class="bi bi-arrow-clockwise"></i> Refresh
    </button>
</div>

<div class="card">
    <div class="card-body">
        <div id="changes-list">Loading...</div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    async function loadChanges() {
        try {
            const data = await api.get('/api/changes/');
            const div = document.getElementById('changes-list');
            const changes = data.changes || [];

            if (changes.length === 0) {
                div.innerHTML = '<p class="text-center text-muted">No changes detected yet.</p>';
                return;
            }

            div.innerHTML = `
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Type</th>
                            <th>Detail</th>
                            <th>Severity</th>
                            <th>Detected</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${changes.map(c => {
                const icons = {
                    'new_subdomain': '🟢',
                    'subdomain_removed': '🔴',
                    'new_port': '🟡',
                    'port_closed': '⚪',
                    'new_vulnerability': '🔴',
                    'vulnerability_resolved': '✅',
                    'new_email': '📧',
                    'email_breached': '🔓'
                };
                const icon = icons[c.change_type] || '🔵';
                const details = c.details || {};
                const message = details.message || c.change_type || 'Unknown';
                const severity = c.severity || 'info';
                const sevClass = {
                    'high': 'bg-danger',
                    'medium': 'bg-warning text-dark',
                    'low': 'bg-info',
                    'info': 'bg-secondary'
                }[severity] || 'bg-secondary';

                const acked = c.acknowledged;
                const changeId = c._id || '';
                const detected = c.detected_at || c.timestamp || '';

                return `
                            <tr>
                                <td>${icon} ${c.change_type || ''}</td>
                                <td>${message}</td>
                                <td><span class="badge ${sevClass}">${severity}</span></td>
                                <td><small>${detected ? new Date(detected).toLocaleString() : '-'}</small></td>
                                <td>
                                    ${acked
                        ? '<span class="badge bg-success">Acknowledged</span>'
                        : `<span class="badge bg-warning text-dark">New</span>
                                           <button class="btn btn-sm btn-outline-success ms-1"
                                                   onclick="ackChange('${changeId}')">
                                               <i class="bi bi-check"></i>
                                           </button>`
                    }
                                </td>
                            </tr>`;
            }).join('')}
                    </tbody>
                </table>
            </div>`;
        } catch (error) {
            console.error('Error:', error);
            document.getElementById('changes-list').innerHTML =
                '<p class="text-center text-danger">Error loading changes</p>';
        }
    }

    async function ackChange(changeId) {
        try {
            await api.patch('/api/changes/acknowledge/' + changeId);
            loadChanges();
        } catch (e) {
            alert('Error acknowledging change');
        }
    }

    loadChanges();
</script>
{% endblock %}
